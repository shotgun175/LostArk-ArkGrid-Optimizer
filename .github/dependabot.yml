# Monthly grouped version updates, with a 7-day cooldown so brand-new releases settle
# first. Security fixes do not wait for this schedule: they open right away via the
# repo settings (Dependabot alerts + security updates).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the Node runtime CI and Deploy use (node-version: 24); a newer major
      # would type APIs the build does not run on. Raise it together with node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # prettier-plugin-svelte 4 cannot install yet: @trivago/prettier-plugin-sort-imports declares a
      # peerOptional prettier-plugin-svelte 3.x, so npm ci fails with ERESOLVE. Drop this once
      # sort-imports accepts 4.x.
      - dependency-name: "prettier-plugin-svelte"
        update-types: ["version-update:semver-major"]
      # A tesseract.js major changes the self-hosted worker, core and model files
      # (scripts/copy-tesseract.cjs) and OCR behavior, so it must be done deliberately,
      # with the test:cv-ocr and test:cv-accuracy checks before and after.
      - dependency-name: "tesseract.js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
