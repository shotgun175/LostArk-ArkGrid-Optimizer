name: CI

# Type-check and run the test suite on every pull request and on pushes to main.
# This is the regression gate that must pass before the Deploy workflow (deploy.yml)
# publishes from main. Mirrors the local `npm run check` + `npm test` gate.
#
# Note on data-drift: supportCutQuality.json is regenerated and diffed below (the
# generator is deterministic — seeded RNG — and imports the app's own scoring
# constants, so a coefficient edit without a regen fails CI). pipelineTable.json is
# NOT guarded: its generator reads `Reference Projects/astrogem-pipeline-table-main/
# index.html`, which is gitignored third-party content absent from a fresh checkout;
# the committed table instead carries a `_meta` block with the input's sha256 + date.
# Regenerate locally and commit when that source table changes.

on:
  push:
    branches: [main]
  pull_request:

# Supersede an older in-progress run on the same ref — but only for pull requests. On pushes to
# main this is the regression gate, so let those runs always complete rather than be cancelled by
# a rapid follow-up merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22 # matches the Deploy workflow's build runtime
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Support-table drift guard
        run: |
          npm run generate:support-cutquality
          git diff --exit-code src/lib/cutplan/supportCutQuality.json
