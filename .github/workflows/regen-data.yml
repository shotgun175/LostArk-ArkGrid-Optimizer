name: Regenerate data tables

# Monthly regenerate of the committed support cut-quality table, opening a PR
# only when the output actually changed (e.g. after a deliberate constants
# edit that skipped the regen). Scoped to generate:support-cutquality — the
# pipeline-table generator's input is untracked third-party content and
# cannot run here (see ci.yml's data-drift note).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *' # monthly; upstream tables move with game patches

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:support-cutquality
      - name: Open a PR if the table changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/regen-support-cutquality
          title: 'chore: regenerate supportCutQuality.json'
          commit-message: 'chore: regenerate supportCutQuality.json'
          body: >
            Automated monthly regeneration of the support cut-quality table.
            A diff here means the committed table had drifted from the
            generator/constants — review before merging.
          delete-branch: true
